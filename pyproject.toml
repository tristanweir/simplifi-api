[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "quicken-simplifi-api"
version = "0.1.0"
description = "Unofficial Simplifi client with browser login and scoped category updates"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "quicken-simplifi-api contributors" }]
keywords = ["quicken", "simplifi", "personal-finance", "api"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Office/Business :: Financial",
]
dependencies = [
  "requests>=2.31",
  "pydantic>=2.0",
  "click>=8.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "responses>=0.25",
  "ruff>=0.6",
]

[project.scripts]
simplifi = "simplifi.local_cli:main"

[project.urls]
Homepage = "https://github.com/tristanweir/simplifi-api"
Issues = "https://github.com/tristanweir/simplifi-api/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/simplifi"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""

[tool.hatch.build.targets.sdist]
include = ["src/simplifi", "docs", "scripts", "tests", "README.md", "LICENSE", "CHANGELOG.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests", "scripts"]
